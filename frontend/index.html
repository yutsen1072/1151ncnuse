<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管院空間與排課系統 — 帳號登入與註冊</title>
  <style>
    :root {
      --bg: #f4f3ef;
      --card: #ffffff;
      --primary: #5c768d;
      --primary-hover: #485e72;
      --sage: #7a9486;
      --text: #333a40;
      --border: #dcdfe2;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      display: flex; justify-content: center; align-items: center; min-height: 100vh;
    }
    .container {
      background: var(--card); width: 100%; max-width: 420px; padding: 32px;
      border-radius: 14px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }
    h2 { margin: 0 0 20px; text-align: center; color: var(--primary); font-size: 1.4rem; }
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .tab-btn {
      flex: 1; padding: 10px; border: 1px solid var(--border); background: #f9f9f7;
      border-radius: 8px; cursor: pointer; font-weight: 600; color: var(--text);
    }
    .tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .form-group { margin-bottom: 14px; }
    label { display: block; margin-bottom: 6px; font-size: 0.9rem; font-weight: 500; }
    input, select {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border);
      border-radius: 8px; font-size: 0.95rem;
    }
    button.submit-btn {
      width: 100%; padding: 12px; margin-top: 8px; background: var(--sage);
      color: #fff; border: none; border-radius: 8px; font-size: 1rem;
      font-weight: 600; cursor: pointer;
    }
    button.submit-btn:hover { opacity: 0.92; }
    #message {
      margin-top: 16px; padding: 10px 12px; border-radius: 8px;
      font-size: 0.9rem; display: none;
    }
    .msg-ok { background: #e6f2ec; color: #2d5a43; display: block !important; }
    .msg-err { background: #fbeaea; color: #8c2d2d; display: block !important; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h2>管院空間與排課系統</h2>
    <div class="tabs">
      <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">登入</button>
      <button class="tab-btn" id="tab-register" onclick="switchTab('register')">註冊帳號</button>
    </div>

    <!-- 登入表單 -->
    <form id="login-form">
      <div class="form-group">
        <label>學號 / 教職員編號</label>
        <input type="text" id="login-username" required placeholder="請輸入帳號" />
      </div>
      <div class="form-group">
        <label>密碼</label>
        <input type="password" id="login-password" required placeholder="請輸入密碼" />
      </div>
      <button type="submit" class="submit-btn">登入系統</button>
    </form>

    <!-- 註冊表單 -->
    <form id="register-form" class="hidden">
      <div class="form-group">
        <label>學號 / 教職員編號</label>
        <input type="text" id="reg-username" required placeholder="例如：113213022" />
      </div>
      <div class="form-group">
        <label>姓名</label>
        <input type="text" id="reg-name" required placeholder="請輸入真實姓名" />
      </div>
      <div class="form-group">
        <label>電子信箱</label>
        <input type="email" id="reg-email" required placeholder="example@mail1.ncnu.edu.tw" />
      </div>
      <div class="form-group">
        <label>密碼</label>
        <input type="password" id="reg-password" required placeholder="設定登入密碼" />
      </div>
      <div class="form-group">
        <label>身分別</label>
        <select id="reg-role">
          <option value="student">學生 (Student)</option>
          <option value="teacher">教師 (Teacher)</option>
        </select>
      </div>
      <button type="submit" class="submit-btn">送出註冊申請</button>
    </form>

    <div id="message"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
