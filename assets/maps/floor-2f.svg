<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <style>
      .building-wall { fill: #f8fafc; stroke: #334155; stroke-width: 4; stroke-linejoin: round; }
      .room-wall { fill: #ffffff; stroke: #64748b; stroke-width: 2; }
      .auditorium { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
      .case-room { fill: #e0e7ff; stroke: #6366f1; stroke-width: 2; }
      .corridor { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 4,4; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: bold; fill: #0f172a; font-size: 20px; }
      .text-room { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #475569; text-anchor: middle; font-weight: 600; }
      .stair-area { fill: #fee2e2; stroke: #fca5a5; }
    </style>
  </defs>

  <!-- 外輪廓大樓主體 -->
  <path class="building-wall" d="M 60 120 L 940 120 L 940 540 L 750 540 L 750 450 L 250 450 L 250 540 L 60 540 Z" />

  <!-- 中庭挑空天井 -->
  <rect x="360" y="240" width="280" height="150" fill="#f0f9ff" stroke="#bae6fd" stroke-width="2" rx="8" />
  <text x="500" y="320" class="text-room" fill="#0369a1" font-size="16">🏛️ 中庭挑空區</text>

  <!-- 主走廊 -->
  <rect x="180" y="200" width="640" height="40" class="corridor" />
  <rect x="180" y="390" width="640" height="40" class="corridor" />
  <rect x="180" y="200" width="40" height="230" class="corridor" />
  <rect x="780" y="200" width="40" height="230" class="corridor" />

  <!-- 2F 教學空間佈局 -->
  <!-- 管206 -->
  <rect x="160" y="140" width="120" height="95" class="room-wall" />
  <text x="220" y="185" class="text-room">管 206</text>
  <text x="220" y="205" font-size="11" fill="#94a3b8" text-anchor="middle">研討室 (40人)</text>

  <!-- 管213 (哈佛式個案教室) -->
  <rect x="415" y="140" width="130" height="95" class="case-room" />
  <text x="480" y="185" class="text-room" fill="#4338ca">管 213 (個案)</text>
  <text x="480" y="205" font-size="11" fill="#6366f1" text-anchor="middle">環形個案教室 (50人)</text>

  <!-- 管226 (個案階梯教室) -->
  <rect x="660" y="140" width="130" height="95" class="case-room" />
  <text x="725" y="185" class="text-room" fill="#4338ca">管 226 (階梯)</text>
  <text x="725" y="205" font-size="11" fill="#6366f1" text-anchor="middle">個案階梯教室 (80人)</text>

  <!-- 管260 (國際會議廳) -->
  <rect x="795" y="290" width="135" height="110" class="auditorium" />
  <text x="862" y="340" class="text-room" fill="#b45309">管 260</text>
  <text x="862" y="360" font-size="11" fill="#d97706" text-anchor="middle">國際會議廳 (120人)</text>

  <!-- 管268 (大型學術演講廳) -->
  <rect x="795" y="410" width="135" height="120" class="auditorium" />
  <text x="862" y="465" class="text-room" fill="#b45309">管 268 演講廳</text>
  <text x="862" y="485" font-size="11" fill="#d97706" text-anchor="middle">大型階梯演講 (270人)</text>

  <!-- 西側梯與東側梯 -->
  <rect x="80" y="360" width="80" height="60" class="stair-area" />
  <text x="120" y="395" class="text-room" fill="#b91c1c" font-size="11">🛗 電梯/西梯</text>

  <rect x="840" y="200" width="80" height="60" class="stair-area" />
  <text x="880" y="235" class="text-room" fill="#b91c1c" font-size="11">🛗 電梯/東梯</text>

  <!-- 樓層標題 -->
  <text x="50" y="70" class="text-title">國立暨南國際大學 管理學院 2F 平面配置圖</text>
</svg>
